<!doctype html>
<html lang="zh-CN">

<head>
  <link rel="icon" href="/assets/logo-white-transparent.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 燕子</title>
  <meta name="description" content="燕子个人中心">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/assets/auth.css">
  <style>
    .profile-container {
      max-width: 600px;
      margin: 4rem auto;
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(20px);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .profile-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .profile-title h1 {
      margin: 0 0 0.25rem 0;
      font-size: 1.75rem;
    }

    .profile-title p {
      margin: 0;
      color: var(--text-dim);
    }

    .profile-info-grid {
      display: grid;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .info-label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-value {
      font-size: 1.1rem;
      color: var(--text);
    }
  </style>
</head>

<body>
  <div class="noise"></div>
  <header class="site-header">
    <div class="brand">
      <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
        <img src="/assets/logo-white-transparent.png" width="36" height="36" alt="燕子启动器 Logo" class="brand-logo"
          style="border-radius: 8px; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));" />
        <span style="font-weight: 600;">燕子启动器</span>
      </a>
    </div>
    <nav>
      <a href="/">首页</a>
      <a href="/store.html">扩展商店</a>
      <a href="/yanm.html">燕幕</a>
      <a href="/docs/product-overview.html">文档</a>
      <a href="/index.html#download">免费下载</a>
    </nav>
  </header>

  <main class="profile-page">
    <div class="profile-container" id="profile-container" style="display: none;">
      <div class="profile-header">
        <div class="profile-avatar-large" id="page-profile-initial">?</div>
        <div class="profile-title">
          <h1 id="page-profile-username">加载中...</h1>
          <p id="page-profile-role">加载中...</p>
        </div>
      </div>

      <div class="profile-info-grid">
        <div class="info-item">
          <span class="info-label">邮箱地址</span>
          <span class="info-value" id="page-profile-email">-</span>
        </div>
      </div>

      <div style="display: flex; gap: 1rem;">
        <button class="button secondary" onclick="window.YanziAuth.logout()" style="flex: 1; padding: 0.8rem;">退出登录</button>
      </div>
    </div>
    
    <div id="profile-login-prompt" style="text-align: center; margin-top: 6rem;">
      <h2>尚未登录</h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">请先登录以查看个人信息</p>
      <button class="button primary" onclick="window.YanziAuth.showLogin()">登录燕子账号</button>
    </div>
  </main>

  <script src="/assets/auth.js"></script>
  <script>
    function renderProfilePage() {
      const user = window.YanziAuth ? window.YanziAuth.getUser() : null;
      const container = document.getElementById("profile-container");
      const prompt = document.getElementById("profile-login-prompt");

      if (user) {
        container.style.display = "block";
        prompt.style.display = "none";
        document.getElementById("page-profile-initial").textContent = (user.username || user.email || "?").substring(0, 1).toUpperCase();
        document.getElementById("page-profile-username").textContent = user.username || "未设置用户名";
        document.getElementById("page-profile-email").textContent = user.email || "-";
        document.getElementById("page-profile-role").textContent = user.isAdmin ? "系统管理员" : "普通用户";
      } else {
        container.style.display = "none";
        prompt.style.display = "block";
      }
    }

    window.addEventListener("yanzi-auth-changed", () => {
      renderProfilePage();
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderProfilePage();
    });
  </script>
</body>

</html>
