<!doctype html>
<html lang="zh-CN">

<head>
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/assets/logo-white-transparent.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>燕子扩展商店</title>
  <link rel="canonical" href="https://yanzi.luoluoluo.cc.cd/store.html">
  <meta name="description" content="燕子扩展商店，帮你快速找到常用工具和现成扩展。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/assets/auth.css">
</head>

<body>
  <style>
    /* 搜索栏与 Hero 优化 */
    .doc-hero {
      text-align: center;
      padding: 6rem 0 4rem;
    }

    .store-search-container {
      max-width: 600px;
      margin: 2.5rem auto 0;
    }

    .store-search-wrapper {
      position: relative;
      width: 100%;
    }

    .store-search-input {
      width: 100%;
      height: 64px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03) !important;
      color: var(--text);
      padding: 0 1.5rem 0 3.5rem;
      font-size: 1.15rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .store-search-input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05) !important;
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.25rem;
      opacity: 0.5;
      pointer-events: none;
      z-index: 1;
    }

    /* 图标网格布局 */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 3rem;
      padding: 2rem 0;
      transition: opacity 0.3s ease;
    }

    .store-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .store-card:hover {
      transform: translateY(-10px);
    }

    .store-card-icon-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      background: transparent;
      position: relative;
    }

    .store-card:hover .store-card-icon-wrapper {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .store-card-icon {
      width: 20px;
      height: 20px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .store-card-icon-wrapper svg {
      color: inherit !important;
      fill: currentColor !important;
    }
    
    .store-card-icon-wrapper svg path {
      fill: currentColor !important;
    }

    .store-card-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }

    .store-card-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      margin-bottom: 0.25rem;
    }

    .store-card-version {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .store-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      padding: 0 0 3rem;
    }

    .store-pagination-info {
      font-size: 0.9rem;
      color: var(--text-dim);
      min-width: 8rem;
      text-align: center;
    }

    /* 详情页模式控制 */
    #store-detail {
      display: none;
    }

    .view-mode-detail #store-detail {
      display: block;
    }

    .view-mode-detail .doc-hero,
    .view-mode-detail .store-grid-container {
      display: none !important;
    }

    .view-mode-detail .store-layout {
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    .back-nav {
      margin-bottom: 2rem;
    }

    .back-button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .back-button:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--panel-hover);
    }

    .detail-head {
      display: flex;
      gap: 2rem;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .detail-title h2 {
      margin: 0;
      font-size: 2rem;
    }

    .detail-title p {
      margin: 0.5rem 0 0;
      color: var(--text-dim);
    }

    .detail-body {
      color: var(--text-muted);
      line-height: 1.8;
      font-size: 1.1rem;
    }
  </style>
  </head>

  <body>
    <div class="noise"></div>
    <header class="site-header">
      <div class="brand">
        <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
          <img src="/assets/logo-white-transparent.png" width="36" height="36" alt="燕子启动器 Logo" class="brand-logo"
            style="border-radius: 8px; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));" />
          <span style="font-weight: 600;">燕子启动器</span>
        </a>
      </div>
      <nav>
        <a href="/">首页</a>
        <a href="/store.html" class="active">扩展商店</a>
        <a href="/yanm.html">燕幕</a>
        <a href="/docs/product-overview.html">文档</a>
        <a href="/index.html#download">免费下载</a>
        <span id="global-auth-container" style="margin-left: 16px; display: inline-flex; align-items: center; vertical-align: middle;">
          <button id="global-login-btn" class="button secondary" style="padding: 0 12px; height: 32px; font-size: 0.85rem; border-radius: 6px; margin: 0; cursor: pointer;">
            登录
          </button>
        </span>
      </nav>
    </header>

    <main class="doc-page">
      <section class="doc-hero">
        <div class="store-search-container">
          <div class="store-search-wrapper">
            <span class="search-icon">🔍</span>
            <input id="store-search" class="store-search-input" type="search" placeholder="搜索扩展名、关键词...">
          </div>
          <div style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 1.5rem;">
            <p id="store-status" style="margin: 0; font-size: 0.9rem; color: var(--text-dim);">找一找适合你的现成工具</p>
            <p id="local-client-status" style="margin: 0; font-size: 0.9rem; color: var(--accent);">本机状态检测中，安装不受影响</p>
          </div>
        </div>
      </section>

      <div class="store-grid-container">
        <div id="store-grid" class="store-grid"></div>
        <div id="store-pagination" class="store-pagination"></div>
      </div>

      <div id="store-detail" class="store-layout"></div>
    </main>

    <script>
      const SITE_BASE = location.protocol === "file:" ? "https://yanzi.luoluoluo.cc.cd" : location.origin;
      const STORE_API_BASE = "https://sync.luoluoluo.cc.cd";
      const LOCAL_AGENT_BASE = "http://127.0.0.1:53919";
      const storeGrid = document.getElementById("store-grid");
      const storeDetail = document.getElementById("store-detail");
      const storeStatus = document.getElementById("store-status");
      const storeSearch = document.getElementById("store-search");
      const localClientStatus = document.getElementById("local-client-status");
      const storePagination = document.getElementById("store-pagination");

      let storeItems = [];
      let currentPage = 1;
      let currentPageSize = 24;
      let totalItems = 0;
      let totalPages = 1;
      let searchDebounce = null;

      let localClientOnline = false;
      let localStatusLoaded = false;
      let localStatusMap = new Map();
      let selectedId = new URLSearchParams(location.search).get("id");
      let currentDetailItem = null;
      let mdiIconPaths = {};
      const mdiIconPathPromise = loadMdiIconPaths();

      function getPackageUrl(item) {
        return item.archive_download_url || `${SITE_BASE}${item.package_path || ""}`;
      }

      function getProtocolUrl(item) {
        return `yanzi://install?extensionId=${encodeURIComponent(item.extension_id)}&source=${encodeURIComponent(getPackageUrl(item))}`;
      }

      async function initStore() {
        const params = new URLSearchParams(location.search);
        storeSearch.value = params.get("q") || "";
        currentPage = Number.parseInt(params.get("page") || "1", 10) || 1;
        const id = params.get("id");
        await loadStorePage(currentPage);
        mdiIconPathPromise.then(() => {
          renderGrid(storeItems);
          if (currentDetailItem) {
            renderDetail(currentDetailItem);
          }
        }).catch(() => {});
        if (id) {
          await openDetailById(id);
        }
      }

      function renderGrid(items) {
        storeGrid.innerHTML = "";
        storeStatus.textContent = totalItems ? `共 ${totalItems} 个工具` : "找一找适合你的现成工具";

        if (!items.length) {
          storeGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-dim);">没有找到匹配的扩展</p>`;
          renderPagination();
          return;
        }

        for (const item of items) {
          const article = document.createElement("article");
          article.className = "store-card";

        article.innerHTML = `
          <div class="store-card-icon-wrapper" style="${getIconWrapperStyle(item, false)}">
            <div class="store-card-icon" style="color: inherit;">${renderIconMarkup(item, 30)}</div>
          </div>
          <div class="store-card-name">${escapeHtml(item.display_name)}</div>
          <div class="store-card-version">v${escapeHtml(item.latest_version)}</div>
          <div class="store-card-version">${escapeHtml(getPublisherLabel(item))}</div>
        `;

          article.addEventListener("click", () => {
            openDetailById(item.extension_id, true);
          });
          storeGrid.appendChild(article);
        }

        renderPagination();
      }

      function renderDetail(item) {
        document.body.classList.add("view-mode-detail");
        window.scrollTo(0, 0);

        const localStatus = localStatusMap.get(item.extension_id) || null;
        const installLabel = localStatus && localStatus.version === item.latest_version
          ? "已安装到本机"
          : localStatus
            ? "更新到最新版"
            : "安装到燕子";

        const hasArchive = !!(item.archive_download_url || item.package_path);
        const installBtnMarkup = hasArchive
          ? `<button class="button primary" style="flex: 1;" type="button" data-install-protocol="${escapeHtml(getProtocolUrl(item))}">${escapeHtml(installLabel)}</button>`
          : `<button class="button primary" style="flex: 1; opacity: 0.5; cursor: not-allowed;" type="button" disabled>暂无安装包</button>`;

        const downloadBtnMarkup = hasArchive
          ? `<a class="button secondary" style="flex: 1; text-align: center; display: inline-flex; align-items: center; justify-content: center;" href="${escapeHtml(getPackageUrl(item))}">下载扩展包</a>`
          : `<a class="button secondary" style="flex: 1; opacity: 0.5; cursor: not-allowed; pointer-events: none; text-align: center; display: inline-flex; align-items: center; justify-content: center;" href="javascript:void(0);" disabled>暂无扩展包</a>`;

        const archiveNoticeMarkup = hasArchive
          ? ""
          : `<p style="margin-top: 1rem; font-size: 0.9rem; color: #ffaa00;">提示：该扩展的发布者尚未上传安装包。</p>`;

        storeDetail.innerHTML = `
        <div class="back-nav">
          <button class="back-button" onclick="goBack()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            返回扩展商店
          </button>
        </div>
        <div class="detail-head">
          <div class="store-card-icon-wrapper" style="${getIconWrapperStyle(item, true)}">
            <div class="store-card-icon" style="font-size: 1.5rem; width: 32px; height: 32px; color: inherit;">${renderIconMarkup(item, 32)}</div>
          </div>
          <div class="detail-title">
            <h2>${escapeHtml(item.display_name)}</h2>
            <p>${escapeHtml(item.extension_id)} · v${escapeHtml(item.latest_version)}</p>
            <p>${escapeHtml(getPublisherLabel(item))}</p>
            <p>${escapeHtml(getPublishedAtLabel(item))}</p>
          </div>
        </div>
        <div class="detail-body">
          <p>${escapeHtml(item.description || "这个工具可以直接用来帮你少点几次鼠标。")}</p>
          <p style="margin-top: 1rem; font-size: 0.9rem; color: var(--accent);">${escapeHtml(getLocalStatusLabel(item))}</p>
          
          <div style="display: flex; gap: 1rem; margin-top: 2.5rem;">
            ${installBtnMarkup}
            ${downloadBtnMarkup}
          </div>
          ${archiveNoticeMarkup}

          ${buildInstallAssist(item)}
          
          <p style="margin-top: 2rem; font-size: 0.85rem; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 1.5rem;">
            点击按钮后，浏览器将尝试拉起燕子客户端完成安装。
          </p>
        </div>
      `;

        for (const button of storeDetail.querySelectorAll("[data-install-protocol]")) {
          button.addEventListener("click", () => {
            const protocol = button.getAttribute("data-install-protocol");
            if (protocol) location.href = protocol;
          });
        }
      }

      function goBack() {
        document.body.classList.remove("view-mode-detail");
        storeDetail.innerHTML = "";
        currentDetailItem = null;
        history.pushState(null, "", buildListUrl());
      }

      window.addEventListener("popstate", async () => {
        const params = new URLSearchParams(location.search);
        storeSearch.value = params.get("q") || "";
        const id = params.get("id");
        if (id) {
          await openDetailById(id);
        } else {
          document.body.classList.remove("view-mode-detail");
          await loadStorePage(Number.parseInt(params.get("page") || "1", 10) || 1);
        }
      });

      function buildInstallAssist(item) {
        if (!localStatusLoaded || localClientOnline) {
          return "";
        }

        return `
        <p>当前没有检测到正在运行的燕子客户端。你可以先启动客户端，再点安装；也可以直接尝试拉起本地协议。</p>
        <div class="hero-actions" style="margin-top: 1rem;">
          <button class="button secondary" type="button" data-install-protocol="${escapeHtml(getProtocolUrl(item))}">仍然尝试拉起</button>
          <a class="button secondary" href="https://wwbnh.lanzout.com/b0pnkaj6j">下载客户端</a>
        </div>
      `;
      }

      async function refreshLocalStatus(ids) {
        localStatusMap = new Map();
        localClientOnline = false;
        localStatusLoaded = false;
        updateLocalClientStatus();

        try {
          const url = new URL(`${LOCAL_AGENT_BASE}/v1/store/extensions/status`);
          url.searchParams.set("ids", ids.join(","));
          const response = await fetch(url);
          if (!response.ok) {
            localStatusLoaded = true;
            updateLocalClientStatus();
            return;
          }

          const payload = await response.json();
          localClientOnline = true;
          localStatusLoaded = true;
          updateLocalClientStatus();
          for (const item of payload.items || []) {
            localStatusMap.set(item.extensionId, item);
          }
        } catch {
          localStatusLoaded = true;
          updateLocalClientStatus();
        }
      }

      function refreshLocalStatusInBackground(ids, mode) {
        if (!Array.isArray(ids) || !ids.length) {
          localStatusLoaded = true;
          updateLocalClientStatus();
          return;
        }

        refreshLocalStatus(ids).then(() => {
          if (mode === "detail" && currentDetailItem) {
            renderDetail(currentDetailItem);
            return;
          }

          renderGrid(storeItems);
        }).catch(() => {});
      }

      async function fetchStoreItems() {
        try {
          const url = new URL(`${STORE_API_BASE}/v1/extensions`);
          const keyword = storeSearch.value.trim();
          if (keyword) {
            url.searchParams.set("q", keyword);
          }

          url.searchParams.set("page", String(currentPage));
          url.searchParams.set("pageSize", String(currentPageSize));
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const payload = await response.json();
          totalItems = Number(payload.total || 0);
          totalPages = Number(payload.total_pages || 1);
          currentPage = Number(payload.page || 1);
          return Array.isArray(payload.items) ? payload.items : [];
        } catch {
          storeStatus.textContent = "扩展数据加载失败";
          totalItems = 0;
          totalPages = 1;
          return [];
        }
      }

      async function fetchStoreDetail(id) {
        const response = await fetch(`${STORE_API_BASE}/v1/extensions/${encodeURIComponent(id)}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        return response.json();
      }

      async function loadStorePage(page) {
        currentPage = Math.max(1, page || 1);
        storeItems = await fetchStoreItems();
        renderGrid(storeItems);
        refreshLocalStatusInBackground(storeItems.map((item) => item.extension_id), "grid");
      }

      async function openDetailById(id, pushState = false) {
        try {
          const item = await fetchStoreDetail(id);
          selectedId = item.extension_id;
          currentDetailItem = item;
          renderDetail(item);
          refreshLocalStatusInBackground([item.extension_id], "detail");
          if (pushState) {
            history.pushState({ id: item.extension_id }, "", `/store.html?id=${encodeURIComponent(item.extension_id)}`);
          }
        } catch {
          document.body.classList.add("view-mode-detail");
          renderEmptyDetail("加载失败", "没有找到对应的扩展详情。");
        }
      }

      function renderPagination() {
        if (totalPages <= 1) {
          storePagination.innerHTML = "";
          return;
        }

        storePagination.innerHTML = `
          <button class="button secondary" type="button" ${currentPage <= 1 ? "disabled" : ""} data-page="${currentPage - 1}">上一页</button>
          <span class="store-pagination-info">第 ${currentPage} / ${totalPages} 页</span>
          <button class="button secondary" type="button" ${currentPage >= totalPages ? "disabled" : ""} data-page="${currentPage + 1}">下一页</button>
        `;

        for (const button of storePagination.querySelectorAll("[data-page]")) {
          button.addEventListener("click", async () => {
            const page = Number.parseInt(button.getAttribute("data-page") || "1", 10);
            history.pushState({ page }, "", buildListUrl(page));
            await loadStorePage(page);
          });
        }
      }

      function buildListUrl(page = currentPage) {
        const params = new URLSearchParams();
        const keyword = storeSearch.value.trim();
        if (keyword) {
          params.set("q", keyword);
        }

        if (page > 1) {
          params.set("page", String(page));
        }

        const query = params.toString();
        return query ? `/store.html?${query}` : "/store.html";
      }

      function updateLocalClientStatus() {
        if (!localStatusLoaded) {
          localClientStatus.textContent = "本机安装状态后台检测中，不影响浏览。";
          return;
        }

        localClientStatus.textContent = localClientOnline
          ? "燕子运行中，可直接安装。"
          : "未检测到燕子客户端，仅影响安装状态显示。";
      }

      function getLocalStatusLabel(item) {
        const localStatus = localStatusMap.get(item.extension_id);
        if (!localStatus) {
          return "当前状态：未安装";
        }

        return localStatus.version === item.latest_version
          ? "当前状态：已安装"
          : `当前状态：可更新，已安装 ${localStatus.version}`;
      }

      function getPublisherLabel(item) {
        return item.publisher_username
          ? `发布者：${item.publisher_username}`
          : "发布者：未知";
      }

      function getPublishedAtLabel(item) {
        const formatted = formatPublishedAt(item.published_at);
        return formatted ? `发布时间：${formatted}` : "发布时间：未知";
      }

      function formatPublishedAt(value) {
        if (!value) {
          return "";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return String(value);
        }

        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function renderIconMarkup(item, size) {
        const icon = String(item.icon || item.manifest?.icon || "").trim();
        const isDefaultLogo = !icon || icon.includes("logo-white-transparent") || icon.includes("logo-white.png");
        
        if (isDefaultLogo) {
          return `<img src="/assets/logo-white-transparent.png" alt="${escapeHtml(item.display_name)}" width="${size}" height="${size}" loading="lazy">`;
        }

        if (/^https?:\/\//i.test(icon)) {
          return `<img src="${escapeHtml(icon)}" alt="${escapeHtml(item.display_name)}" width="${size}" height="${size}" loading="lazy" referrerpolicy="no-referrer">`;
        }

        const mdiName = normalizeMdiIconName(icon);
        const mdiPath = mdiName ? mdiIconPaths[mdiName] : "";
        if (mdiPath) {
          return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${escapeHtml(mdiPath)}" fill="currentColor"></path></svg>`;
        }

        return `<img src="/assets/logo-white-transparent.png" alt="${escapeHtml(item.display_name)}" width="${size}" height="${size}" loading="lazy">`;
      }

      function normalizeCssColor(hex) {
        if (!hex || typeof hex !== "string") return "#38BDF8";
        hex = hex.trim();
        if (hex.startsWith("#") && hex.length === 9) {
          // #FFEC4899 (ARGB) -> #EC4899 (RGB)
          return "#" + hex.slice(3);
        }
        return hex;
      }

      function getIconWrapperStyle(item, isDetail = false) {
        const icon = String(item.icon || item.manifest?.icon || "").trim();
        const isDefaultLogo = !icon || icon.includes("logo-white-transparent") || icon.includes("logo-white.png") || !/^https?:\/\//i.test(icon);
        const isImage = !isDefaultLogo && /^https?:\/\//i.test(icon);
        const rawColor = item.accent_hex || item.manifest?.accentHex || item.manifest?.accent_hex || "#38BDF8";
        const color = normalizeCssColor(rawColor);
        
        if (isImage) {
          if (isDetail) {
            return `width: 48px; height: 48px; border-radius: 12px; margin-bottom: 0; background: transparent !important; border: 1px solid var(--border) !important;`;
          }
          return `background: transparent !important; border: 1px solid var(--border) !important;`;
        } else {
          if (isDetail) {
            return `width: 48px; height: 48px; border-radius: 12px; margin-bottom: 0; background: ${color} !important; border: none !important; color: white !important; display: flex; align-items: center; justify-content: center;`;
          }
          return `background: ${color} !important; border: none !important; color: white !important; display: flex; align-items: center; justify-content: center;`;
        }
      }

      async function loadMdiIconPaths() {
        try {
          const response = await fetch("/assets/mdi-icons.json");
          if (!response.ok) {
            return;
          }

          const payload = await response.json();
          if (payload && typeof payload === "object") {
            mdiIconPaths = payload;
          }
        } catch {
          mdiIconPaths = {};
        }
      }

      function normalizeMdiIconName(icon) {
        if (!icon) {
          return "";
        }

        const value = String(icon).trim().toLowerCase();
        if (!value.startsWith("mdi:")) {
          return "";
        }

        return value.slice(4).trim();
      }

      function renderEmptyDetail(title, message) {
        storeDetail.innerHTML = `
        <article class="guide-card">
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(message)}</p>
        </article>
      `;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      storeSearch.addEventListener("input", () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(async () => {
          history.pushState({ page: 1 }, "", buildListUrl(1));
          await loadStorePage(1);
        }, 220);
      });

      initStore();
    </script>
