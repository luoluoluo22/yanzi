<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/assets/logo-white-transparent.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>燕子版本后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-shell {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .admin-field {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .admin-field.full {
      grid-column: 1 / -1;
    }

    .admin-field label {
      font-size: 0.92rem;
      color: var(--text-soft);
    }

    .admin-input,
    .admin-textarea {
      width: 100%;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 0.9rem 1rem;
      font: inherit;
      outline: none;
    }

    .admin-input:focus,
    .admin-textarea:focus {
      border-color: rgba(96, 165, 250, 0.8);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .admin-textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.65;
    }

    .admin-actions {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .admin-status {
      margin-top: 0.75rem;
      color: var(--text-soft);
      min-height: 1.4rem;
    }

    .admin-muted {
      color: var(--text-muted);
      line-height: 1.7;
    }

    .admin-hidden {
      display: none !important;
    }

    @media (max-width: 720px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="doc-page">
  <div class="noise"></div>
  <header class="site-header">
    <div class="brand">
      <a href="/" style="display: flex; align-items: center;">
        <img src="/assets/logo-white-transparent.png" width="36" height="36" alt="燕子启动器 Logo" class="brand-logo" />
      </a>
      <a href="/" style="text-decoration: none; color: inherit; font-weight: 600;">燕子启动器</a>
    </div>
    <nav>
      <a href="/store.html">扩展商店</a>
      <a href="/update-admin.html">版本后台</a>
      <a href="/">返回首页</a>
    </nav>
  </header>

  <main>
    <section class="doc-hero">
      <div class="section-head">
        <p class="eyebrow">版本后台</p>
        <h1>维护官网与客户端的最新版本元数据</h1>
      </div>
    </section>

    <section class="section">
      <div class="admin-shell">
        <article class="guide-card" id="login-card">
          <h2>管理员登录</h2>
          <p class="admin-muted">使用现有燕子账号登录。只有管理员用户名才允许保存最新版信息。</p>
          <div class="admin-grid">
            <div class="admin-field">
              <label for="login-email">邮箱</label>
              <input id="login-email" class="admin-input" type="email" autocomplete="username" placeholder="you@example.com">
            </div>
            <div class="admin-field">
              <label for="login-password">密码</label>
              <input id="login-password" class="admin-input" type="password" autocomplete="current-password" placeholder="请输入密码">
            </div>
          </div>
          <div class="admin-actions" style="margin-top: 1rem;">
            <button class="button primary" id="login-button" type="button">登录后台</button>
          </div>
          <div class="admin-status" id="login-status"></div>
        </article>

        <article class="guide-card admin-hidden" id="editor-card">
          <div class="admin-actions" style="justify-content: space-between;">
            <div>
              <h2 style="margin-bottom: 0.35rem;">稳定版更新信息</h2>
              <p class="admin-muted" id="admin-user-label">未登录</p>
            </div>
            <button class="button secondary" id="logout-button" type="button">退出登录</button>
          </div>

          <div class="admin-grid" style="margin-top: 1.5rem;">
            <div class="admin-field">
              <label for="release-channel">发布平台 / 渠道</label>
              <select id="release-channel" class="admin-input">
                <option value="stable">Windows 稳定版 (stable)</option>
                <option value="android">Android 稳定版 (android)</option>
              </select>
            </div>
            <div class="admin-field">
              <label for="release-version">版本号</label>
              <input id="release-version" class="admin-input" type="text" placeholder="例如 0.1.1">
            </div>
            <div class="admin-field">
              <label for="release-title">标题</label>
              <input id="release-title" class="admin-input" type="text" placeholder="例如 燕子启动器 for Windows">
            </div>
            <div class="admin-field">
              <label for="release-file-name">安装包文件名</label>
              <input id="release-file-name" class="admin-input" type="text" placeholder="例如 YanziSetup-0.1.1.exe">
            </div>
            <div class="admin-field">
              <label for="release-download-code">提取码</label>
              <input id="release-download-code" class="admin-input" type="text" placeholder="例如 62yn">
            </div>
            <div class="admin-field full">
              <label for="release-download-url">下载地址</label>
              <input id="release-download-url" class="admin-input" type="url" placeholder="https://...">
            </div>
            <div class="admin-field">
              <label for="release-provider">渠道标识</label>
              <input id="release-provider" class="admin-input" type="text" placeholder="例如 lanzou">
            </div>
            <div class="admin-field">
              <label for="release-published-at">发布时间</label>
              <input id="release-published-at" class="admin-input" type="datetime-local">
            </div>
            <div class="admin-field full">
              <label for="release-sha256">SHA256</label>
              <input id="release-sha256" class="admin-input" type="text" placeholder="可选，64 位小写十六进制">
            </div>
            <div class="admin-field full">
              <label for="release-notes">更新说明</label>
              <textarea id="release-notes" class="admin-textarea" placeholder="填写本次更新内容、修复项、注意事项"></textarea>
            </div>
          </div>

          <div class="admin-actions" style="margin-top: 1.25rem;">
            <button class="button secondary" id="refresh-button" type="button">重新加载</button>
            <button class="button primary" id="save-button" type="button">保存最新版</button>
          </div>
          <div class="admin-status" id="editor-status"></div>
        </article>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const API_BASE = "https://openquickhost-sync.a1137583371.workers.dev";
      const TOKEN_KEY = "yanzi_update_admin_token";
      const USER_KEY = "yanzi_update_admin_user";

      const loginCard = document.getElementById("login-card");
      const editorCard = document.getElementById("editor-card");
      const loginStatus = document.getElementById("login-status");
      const editorStatus = document.getElementById("editor-status");
      const adminUserLabel = document.getElementById("admin-user-label");

      const loginEmail = document.getElementById("login-email");
      const loginPassword = document.getElementById("login-password");
      const loginButton = document.getElementById("login-button");
      const logoutButton = document.getElementById("logout-button");
      const refreshButton = document.getElementById("refresh-button");
      const saveButton = document.getElementById("save-button");
      const releaseChannel = document.getElementById("release-channel");

      const fields = {
        version: document.getElementById("release-version"),
        title: document.getElementById("release-title"),
        file_name: document.getElementById("release-file-name"),
        download_code: document.getElementById("release-download-code"),
        download_url: document.getElementById("release-download-url"),
        provider: document.getElementById("release-provider"),
        published_at: document.getElementById("release-published-at"),
        sha256: document.getElementById("release-sha256"),
        notes: document.getElementById("release-notes")
      };

      function getToken() {
        return localStorage.getItem(TOKEN_KEY) || "";
      }

      function setToken(token) {
        if (token) {
          localStorage.setItem(TOKEN_KEY, token);
        } else {
          localStorage.removeItem(TOKEN_KEY);
        }
      }

      function setUser(user) {
        if (user) {
          localStorage.setItem(USER_KEY, JSON.stringify(user));
        } else {
          localStorage.removeItem(USER_KEY);
        }
      }

      function getStoredUser() {
        try {
          return JSON.parse(localStorage.getItem(USER_KEY) || "null");
        } catch {
          return null;
        }
      }

      function setBusy(button, busy, label) {
        if (!button) return;
        if (busy) {
          button.dataset.originalLabel = button.textContent;
          button.textContent = label;
        } else if (button.dataset.originalLabel) {
          button.textContent = button.dataset.originalLabel;
        }
        button.disabled = busy;
      }

      function setStatus(target, message, isError) {
        target.textContent = message || "";
        target.style.color = isError ? "#fca5a5" : "";
      }

      function toLocalDateTimeInput(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        const offset = date.getTimezoneOffset();
        const local = new Date(date.getTime() - offset * 60000);
        return local.toISOString().slice(0, 16);
      }

      function fromLocalDateTimeInput(value) {
        if (!value) return "";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "" : date.toISOString();
      }

      async function api(path, options) {
        const headers = new Headers(options && options.headers ? options.headers : {});
        const token = getToken();
        if (token) {
          headers.set("Authorization", `Bearer ${token}`);
        }

        const response = await fetch(`${API_BASE}${path}`, {
          ...options,
          headers
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.message || `请求失败：${response.status}`);
        }
        return data;
      }

      function fillForm(data) {
        fields.version.value = data.version || "";
        fields.title.value = data.title || "";
        fields.file_name.value = data.file_name || "";
        fields.download_code.value = data.download_code || "";
        fields.download_url.value = data.download_url || "";
        fields.provider.value = data.provider || "";
        fields.published_at.value = toLocalDateTimeInput(data.published_at);
        fields.sha256.value = data.sha256 || "";
        fields.notes.value = data.notes || "";
      }

      function collectPayload() {
        return {
          version: fields.version.value.trim(),
          title: fields.title.value.trim(),
          file_name: fields.file_name.value.trim(),
          download_code: fields.download_code.value.trim(),
          download_url: fields.download_url.value.trim(),
          provider: fields.provider.value.trim(),
          published_at: fromLocalDateTimeInput(fields.published_at.value),
          sha256: fields.sha256.value.trim(),
          notes: fields.notes.value
        };
      }

      function showEditor(user) {
        loginCard.classList.add("admin-hidden");
        editorCard.classList.remove("admin-hidden");
        adminUserLabel.textContent = `当前登录：${user.username || "未知用户"}${user.isAdmin ? " · 管理员" : ""}`;
      }

      function showLogin() {
        editorCard.classList.add("admin-hidden");
        loginCard.classList.remove("admin-hidden");
      }

      async function loadEditorData() {
        const channel = releaseChannel ? releaseChannel.value : "stable";
        setStatus(editorStatus, `正在加载渠道 ${channel} 的当前版本信息...`, false);
        const data = await api("/v1/admin/app/update/latest?channel=" + channel);
        fillForm(data);
        setStatus(editorStatus, `已加载渠道 ${channel} 版本 ${data.version}`, false);
      }

      async function tryRestoreSession() {
        const token = getToken();
        const storedUser = getStoredUser();
        if (!token || !storedUser) {
          showLogin();
          return;
        }

        try {
          const me = await api("/v1/auth/me");
          if (!me.isAdmin) {
            throw new Error("当前账号不是管理员");
          }
          setUser(me);
          showEditor(me);
          await loadEditorData();
        } catch (error) {
          setToken("");
          setUser(null);
          showLogin();
          setStatus(loginStatus, error.message || "登录状态失效，请重新登录", true);
        }
      }

      loginButton.addEventListener("click", async function () {
        setBusy(loginButton, true, "登录中...");
        setStatus(loginStatus, "", false);
        try {
          const payload = {
            email: loginEmail.value.trim(),
            password: loginPassword.value
          };
          const auth = await api("/v1/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });
          setToken(auth.accessToken || "");
          const me = await api("/v1/auth/me");
          if (!me.isAdmin) {
            throw new Error("当前账号没有后台权限");
          }
          setUser(me);
          showEditor(me);
          await loadEditorData();
          loginPassword.value = "";
          setStatus(loginStatus, "", false);
        } catch (error) {
          setToken("");
          setUser(null);
          showLogin();
          setStatus(loginStatus, error.message || "登录失败", true);
        } finally {
          setBusy(loginButton, false);
        }
      });

      logoutButton.addEventListener("click", function () {
        setToken("");
        setUser(null);
        showLogin();
        setStatus(editorStatus, "", false);
        setStatus(loginStatus, "已退出登录", false);
      });

      refreshButton.addEventListener("click", async function () {
        setBusy(refreshButton, true, "加载中...");
        try {
          await loadEditorData();
        } catch (error) {
          setStatus(editorStatus, error.message || "加载失败", true);
        } finally {
          setBusy(refreshButton, false);
        }
      });

      saveButton.addEventListener("click", async function () {
        const channel = releaseChannel ? releaseChannel.value : "stable";
        setBusy(saveButton, true, "保存中...");
        try {
          const data = await api("/v1/admin/app/update/latest?channel=" + channel, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(collectPayload())
          });
          fillForm(data);
          setStatus(editorStatus, `已保存渠道 ${channel} 版本 ${data.version}，官网和客户端接口会读取这条最新记录。`, false);
        } catch (error) {
          setStatus(editorStatus, error.message || "保存失败", true);
        } finally {
          setBusy(saveButton, false);
        }
      });

      if (releaseChannel) {
        releaseChannel.addEventListener("change", loadEditorData);
      }

      tryRestoreSession();
    })();
  </script>
</body>
</html>
