name: Publish application release

on:
  push:
    branches: [main]
    paths:
      - "release-inputs/applications/**"
      - ".github/workflows/publish-application-release.yml"
      - "scripts/application-release-ci.py"
      - "scripts/application-release-changes.py"
  workflow_dispatch:
    inputs:
      application:
        description: Companion application to publish
        type: choice
        options: [all, yanzi-album, yanzi-notes]
        default: all

permissions:
  contents: read

concurrency:
  group: application-release
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.changed.outputs.metadata }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: echo "metadata=$(python3 scripts/application-release-changes.py)" >> "$GITHUB_OUTPUT"

  publish:
    needs: select
    if: needs.select.outputs.metadata != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        metadata: ${{ fromJSON(needs.select.outputs.metadata) }}
    env:
      RELEASE_META: ${{ matrix.metadata }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release input and prepare catalog
        run: python3 scripts/application-release-ci.py prepare "$RELEASE_META"
      - name: Resolve artifact name
        id: release
        run: |
          echo "apk=$(python3 -c 'import json; print(json.load(open(".artifacts/application-release/entry.json"))["downloadPath"].split("/")[-1])')" >> "$GITHUB_OUTPUT"
          echo "apk_path=$(python3 -c 'import json,os; print(json.load(open(os.environ["RELEASE_META"]))["apkPath"])')" >> "$GITHUB_OUTPUT"
      - name: Upload immutable APK
        run: >
          npx --yes wrangler@4 r2 object put
          "openquickhost-sync-assets/downloads/applications/${{ steps.release.outputs.apk }}"
          --file "${{ steps.release.outputs.apk_path }}"
          --content-type application/vnd.android.package-archive
          --remote --config wrangler.jsonc
      - name: Publish catalog
        run: >
          npx --yes wrangler@4 r2 object put
          "openquickhost-sync-assets/downloads/applications/catalog.json"
          --file ".artifacts/application-release/catalog.json"
          --content-type application/json --remote --config wrangler.jsonc
      - name: Verify public release
        run: python3 scripts/application-release-ci.py verify "$RELEASE_META"
