name: Publish application release

on:
  push:
    branches: [main]
    paths:
      - "release-inputs/applications/**"
      - ".github/workflows/publish-application-release.yml"
      - "scripts/application-release-ci.py"
      - "scripts/application-release-changes.py"
  workflow_dispatch:
    inputs:
      application:
        description: Companion application to publish
        type: choice
        options: [all, yanzi-album, yanzi-notes]
        default: all

permissions:
  contents: read

concurrency:
  group: application-release
  cancel-in-progress: false

jobs:
  select:
    if: github.ref_name != 'release/notification-replay-v1.0.14'
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.changed.outputs.metadata }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: echo "metadata=$(python3 scripts/application-release-changes.py)" >> "$GITHUB_OUTPUT"

  publish:
    needs: select
    if: needs.select.outputs.metadata != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        metadata: ${{ fromJSON(needs.select.outputs.metadata) }}
    env:
      RELEASE_META: ${{ matrix.metadata }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release input and prepare catalog
        run: python3 scripts/application-release-ci.py prepare "$RELEASE_META"
      - name: Resolve artifact name
        id: release
        run: |
          echo "apk=$(python3 -c 'import json; print(json.load(open(".artifacts/application-release/entry.json"))["downloadPath"].split("/")[-1])')" >> "$GITHUB_OUTPUT"
          echo "apk_path=$(python3 -c 'import json,os; print(json.load(open(os.environ["RELEASE_META"]))["apkPath"])')" >> "$GITHUB_OUTPUT"
      - name: Upload immutable APK
        run: >
          npx --yes wrangler@4 r2 object put
          "openquickhost-sync-assets/downloads/applications/${{ steps.release.outputs.apk }}"
          --file "${{ steps.release.outputs.apk_path }}"
          --content-type application/vnd.android.package-archive
          --remote --config wrangler.jsonc
      - name: Publish catalog
        run: >
          npx --yes wrangler@4 r2 object put
          "openquickhost-sync-assets/downloads/applications/catalog.json"
          --file ".artifacts/application-release/catalog.json"
          --content-type application/json --remote --config wrangler.jsonc
      - name: Verify public release
        run: python3 scripts/application-release-ci.py verify "$RELEASE_META"

  desktop-lan-release:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'release/notification-replay-v1.0.14'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Prepare Windows packaging dependencies
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Velopack CLI' }
          dotnet restore src/OpenQuickHost/OpenQuickHost.csproj --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore desktop project' }
          dotnet restore src/Yanzi.Runtime/Yanzi.Runtime.csproj --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore runtime project' }
      - name: Build complete Windows installer
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          & ./scripts/publish-installer.ps1 -Version 1.0.14 -SkipBaselineDownload -KeepHistoricalPackages
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
      - name: Upload release assets from GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.14 .artifacts/installer/Yanzi-win-Setup-1.0.14.exe .artifacts/installer/Yanzi-win-Portable-1.0.14.zip .artifacts/installer/Yanzi-1.0.14-full.nupkg .artifacts/installer/RELEASES .artifacts/installer/releases.win.json .artifacts/installer/assets.win.json --repo luoluoluo22/yanzi --clobber
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release asset upload failed' }
      - name: Verify complete draft resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view v1.0.14 --repo luoluoluo22/yanzi --json assets,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Draft release not found' }
          foreach ($name in @('Yanzi-win-Setup-1.0.14.exe','Yanzi-win-Portable-1.0.14.zip','Yanzi-1.0.14-full.nupkg','releases.win.json','RELEASES','assets.win.json')) {
            if ($name -notin @($release.assets | ForEach-Object name)) { throw "Missing artifact: $name" }
          }
          Write-Host 'Desktop release draft verified.'
