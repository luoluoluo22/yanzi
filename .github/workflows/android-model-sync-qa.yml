name: Android mobile model sync QA
on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-model-sync-qa.yml"
permissions:
  contents: read
jobs:
  android-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest supplies the Android SDK; Gradle resolves installed SDK platforms.
      - name: Create disposable QA-only debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Android Debug,O=Yanzi QA,C=US"
      - name: Build isolated development APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDev -PYANZI_ANDROID_DEV_SUFFIX=.modelqa.dev -PYANZI_ANDROID_DEV_KEYSTORE=$HOME/.android/debug.keystore --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: yanzi-model-sync-dev-apk
          path: mobile/android/app/build/outputs/apk/dev/*.apk
          if-no-files-found: error
          retention-days: 2
