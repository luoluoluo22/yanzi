<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超级马里奥</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Press Start 2P', monospace, Arial;
}
canvas { border: 2px solid #333; image-rendering: pixelated; }
#ui {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 14px; display: flex; gap: 40px;
  text-shadow: 2px 2px #000;
}
#controls {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  color: #888; font-size: 11px; text-align: center;
}
</style>
</head>
<body>
<div id="ui">
  <span>MARIO</span>
  <span id="scoreDisplay">SCORE: 0</span>
  <span id="coinDisplay">COINS: 0</span>
  <span id="worldDisplay">WORLD 1-1</span>
  <span id="livesDisplay">LIVES: 3</span>
  <span id="timeDisplay">TIME: 400</span>
</div>
<canvas id="game"></canvas>
<div id="controls">方向键移动 | 空格键跳跃 | R键重新开始</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;
canvas.width = W; canvas.height = H;

const TILE = 32;
const GRAVITY = 0.6;
const FRICTION = 0.8;
const MAX_SPEED = 5;
const JUMP_FORCE = -12;

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });

let gameState = 'title';
let score = 0, coins = 0, lives = 3, time = 400, timeTimer = 0;
let cameraX = 0;
let particles = [];
let floatingTexts = [];

// Level data
const LEVEL_WIDTH = 200;
const level = [];
const enemies = [];
const coinItems = [];
const blocks = [];
const pipes = [];
const flagpole = { x: 195 * TILE, y: 0 };

function initLevel() {
  level.length = 0;
  enemies.length = 0;
  coinItems.length = 0;
  blocks.length = 0;
  pipes.length = [];
  particles.length = 0;
  floatingTexts.length = 0;
  score = 0; coins = 0; time = 400; cameraX = 0;

  // Ground
  for (let x = 0; x < LEVEL_WIDTH; x++) {
    if ((x >= 69 && x < 72) || (x >= 86 && x < 89) || (x >= 153 && x < 155)) continue;
    level[x] = level[x] || [];
    level[x][14] = 'ground';
    level[x][15] = 'ground';
  }

  // Platforms & blocks
  const addBlock = (x, y, type) => {
    level[x] = level[x] || [];
    level[x][y] = type;
    blocks.push({ x: x * TILE, y: y * TILE, w: TILE, h: TILE, type, hit: false, contents: type === 'question' ? 'coin' : null });
  };

  // Question blocks
  [16,21,23,78,94,106,109,129,130,170].forEach(x => addBlock(x, 10, 'question'));
  [22].forEach(x => addBlock(x, 6, 'question'));

  // Brick blocks
  [20,22,77,79,80,91,92,93,94,100,101,118,119,128,131,148,149,150,168,169,171].forEach(x => addBlock(x, 10, 'brick'));
  [91,92,93,94,100,101].forEach(x => addBlock(x, 6, 'brick'));

  // Floating bricks
  [114,115,116].forEach(x => addBlock(x, 6, 'brick'));

  // Pipes
  const addPipe = (x, h) => {
    pipes.push({ x: x * TILE, y: (14 - h) * TILE, w: TILE * 2, h: h * TILE });
    for (let py = 14 - h; py < 14; py++) {
      level[x] = level[x] || [];
      level[x][py] = 'pipe';
      level[x + 1] = level[x + 1] || [];
      level[x + 1][py] = 'pipe';
    }
  };
  addPipe(28, 2); addPipe(38, 3); addPipe(46, 3); addPipe(57, 4);
  addPipe(163, 2); addPipe(179, 2);

  // Coins in the air
  [[23,8],[24,8],[25,8],[94,8],[95,8],[115,4],[116,4]].forEach(([x,y]) => {
    coinItems.push({ x: x * TILE + 8, y: y * TILE + 8, w: 16, h: 16, collected: false });
  });

  // Enemies
  const addEnemy = (x, y, type) => {
    enemies.push({ x: x * TILE, y: y * TILE, vx: type === 'koopa' ? -1 : -1, vy: 0, w: TILE, h: TILE, type, alive: true, frame: 0, shellMoving: false });
  };
  [22,40,51,52,80,82,97,98,107,110,120,124,127,165,174,175].forEach(x => addEnemy(x, 13, 'goomba'));
  [107,174].forEach(x => addEnemy(x, 12, 'koopa'));
}

// Mario
let mario = {
  x: 3 * TILE, y: 12 * TILE, vx: 0, vy: 0,
  w: 28, h: 32, onGround: false, facing: 1,
  frame: 0, animTimer: 0, invincible: 0, dead: false, win: false
};

function resetMario() {
  mario.x = 3 * TILE; mario.y = 12 * TILE;
  mario.vx = 0; mario.vy = 0; mario.onGround = false;
  mario.dead = false; mario.win = false; mario.invincible = 0;
  mario.frame = 0; cameraX = 0;
}

function drawMario() {
  if (mario.invincible > 0 && Math.floor(mario.invincible / 3) % 2) return;
  const x = Math.round(mario.x - cameraX);
  const y = Math.round(mario.y);
  const f = mario.facing;

  ctx.save();
  if (f < 0) { ctx.translate(x + mario.w, 0); ctx.scale(-1, 1); x = 0; }

  // Hat
  ctx.fillStyle = '#E52521';
  ctx.fillRect(x + 6, y + 2, 18, 8);
  ctx.fillRect(x + 4, y + 4, 22, 6);

  // Face
  ctx.fillStyle = '#FBB882';
  ctx.fillRect(x + 4, y + 10, 22, 10);

  // Eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 18, y + 12, 4, 4);

  // Mustache
  ctx.fillStyle = '#6B3300';
  ctx.fillRect(x + 14, y + 16, 12, 3);

  // Body (overalls)
  ctx.fillStyle = '#E52521';
  ctx.fillRect(x + 4, y + 20, 20, 6);

  ctx.fillStyle = '#3B17C4';
  ctx.fillRect(x + 4, y + 24, 20, 8);

  // Buttons
  ctx.fillStyle = '#FBB882';
  ctx.fillRect(x + 10, y + 26, 3, 3);
  ctx.fillRect(x + 16, y + 26, 3, 3);

  // Shoes
  ctx.fillStyle = '#6B3300';
  if (mario.onGround && Math.abs(mario.vx) > 0.5) {
    const step = Math.floor(mario.animTimer / 5) % 2;
    ctx.fillRect(x + 2 + step * 4, y + 30, 10, 4);
    ctx.fillRect(x + 16 - step * 4, y + 30, 10, 4);
  } else {
    ctx.fillRect(x + 2, y + 30, 10, 4);
    ctx.fillRect(x + 16, y + 30, 10, 4);
  }

  ctx.restore();
}

function drawGoomba(e) {
  const x = Math.round(e.x - cameraX), y = Math.round(e.y);
  ctx.fillStyle = '#C84C09';
  ctx.beginPath();
  ctx.arc(x + 16, y + 12, 14, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(x + 2, y + 12, 28, 14);
  ctx.fillStyle = '#FBB882';
  ctx.fillRect(x + 4, y + 22, 24, 10);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 8, y + 10, 4, 4);
  ctx.fillRect(x + 20, y + 10, 4, 4);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 6, y + 26, 8, 4);
  ctx.fillRect(x + 18, y + 26, 8, 4);
}

function drawKoopa(e) {
  const x = Math.round(e.x - cameraX), y = Math.round(e.y);
  ctx.fillStyle = '#2E8B57';
  ctx.beginPath();
  ctx.ellipse(x + 16, y + 10, 12, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FBB882';
  ctx.fillRect(x + 8, y + 2, 16, 10);
  ctx.fillStyle = '#E52521';
  ctx.beginPath();
  ctx.ellipse(x + 16, y + 22, 14, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FBB882';
  ctx.fillRect(x + 6, y + 28, 20, 6);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 12, y + 4, 3, 3);
  ctx.fillRect(x + 18, y + 4, 3, 3);
}

function drawCoinItem(c) {
  const x = Math.round(c.x - cameraX), y = Math.round(c.y);
  const w = 8 + Math.abs(Math.sin(Date.now() / 200)) * 6;
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.ellipse(x + 8, y + 8, w, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.ellipse(x + 8, y + 8, w * 0.5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBlock(b) {
  const x = Math.round(b.x - cameraX), y = Math.round(b.y);
  if (b.type === 'brick') {
    ctx.fillStyle = '#C84C09';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#E8A060';
    ctx.fillRect(x + 2, y + 2, 12, 12);
    ctx.fillRect(x + 18, y + 2, 12, 12);
    ctx.fillRect(x + 2, y + 18, 28, 12);
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, TILE, TILE);
  } else if (b.type === 'question') {
    ctx.fillStyle = b.hit ? '#8B7355' : '#FFD700';
    ctx.fillRect(x, y, TILE, TILE);
    if (!b.hit) {
      ctx.fillStyle = '#C84C09';
      ctx.fillRect(x + 2, y + 2, 28, 28);
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(x + 4, y + 4, 24, 24);
      ctx.fillStyle = '#8B4513';
      ctx.font = '20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('?', x + 16, y + 24);
    }
  } else if (b.type === 'ground') {
    ctx.fillStyle = '#C84C09';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#E8A060';
    ctx.fillRect(x + 1, y + 1, 14, 14);
    ctx.fillRect(x + 17, y + 1, 14, 14);
  } else if (b.type === 'pipe') {
    ctx.fillStyle = '#00A800';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#00D800';
    ctx.fillRect(x + 2, y, 8, TILE);
    ctx.fillStyle = '#006800';
    ctx.fillRect(x + TILE - 4, y, 4, TILE);
  }
}

function drawBackground() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#5C94FC');
  grad.addColorStop(1, '#87CEEB');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  ctx.fillStyle = '#fff';
  const cloudPositions = [[100,60],[300,40],[600,70],[900,50],[1200,35],[1500,65],[1800,45],[2100,55],[2400,30]];
  cloudPositions.forEach(([cx, cy]) => {
    const sx = cx - cameraX * 0.3;
    if (sx > -100 && sx < W + 100) {
      ctx.beginPath();
      ctx.arc(sx, cy, 20, 0, Math.PI * 2);
      ctx.arc(sx + 20, cy - 10, 25, 0, Math.PI * 2);
      ctx.arc(sx + 45, cy, 20, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Hills
  ctx.fillStyle = '#4AA52E';
  const hillPositions = [[0, 200],[400, 150],[800, 180],[1200, 140],[1600, 170],[2000, 160]];
  hillPositions.forEach(([hx, hw]) => {
    const sx = hx - cameraX * 0.5;
    ctx.beginPath();
    ctx.moveTo(sx, H - 64);
    ctx.quadraticCurveTo(sx + hw / 2, H - 64 - 80, sx + hw, H - 64);
    ctx.fill();
  });

  // Bushes
  ctx.fillStyle = '#3D8B37';
  const bushPositions = [[150, 50],[500, 60],[750, 40],[1100, 55],[1400, 45],[1750, 50],[2050, 35]];
  bushPositions.forEach(([bx, bw]) => {
    const sx = bx - cameraX * 0.7;
    ctx.beginPath();
    ctx.arc(sx, H - 68, bw / 3, 0, Math.PI * 2);
    ctx.arc(sx + bw / 3, H - 72, bw / 2.5, 0, Math.PI * 2);
    ctx.arc(sx + bw * 0.7, H - 68, bw / 3, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawFlagpole() {
  const x = Math.round(flagpole.x - cameraX);
  ctx.fillStyle = '#888';
  ctx.fillRect(x + 14, 3 * TILE, 4, 11 * TILE);
  ctx.fillStyle = '#00A800';
  ctx.beginPath();
  ctx.moveTo(x + 18, 3 * TILE);
  ctx.lineTo(x + 18 + 30, 3 * TILE + 15);
  ctx.lineTo(x + 18, 3 * TILE + 30);
  ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(x + 16, 3 * TILE - 8, 8, 0, Math.PI * 2);
  ctx.fill();
}

function addParticle(x, y, color, count = 5) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 8,
      vy: -Math.random() * 8 - 2,
      life: 30 + Math.random() * 20,
      color, size: 2 + Math.random() * 4
    });
  }
}

function addFloatingText(x, y, text, color = '#fff') {
  floatingTexts.push({ x, y, text, color, life: 60, vy: -2 });
}

function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  if (gameState !== 'playing') return;

  // Time
  timeTimer++;
  if (timeTimer >= 24) { timeTimer = 0; time--; if (time <= 0) { killMario(); } }

  // Mario input
  if (!mario.dead && !mario.win) {
    if (keys['ArrowLeft'] || keys['KeyA']) { mario.vx -= 0.8; mario.facing = -1; }
    if (keys['ArrowRight'] || keys['KeyD']) { mario.vx += 0.8; mario.facing = 1; }
    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && mario.onGround) {
      mario.vy = JUMP_FORCE;
      mario.onGround = false;
    }
  }

  mario.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, mario.vx));
  if (!keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['KeyA'] && !keys['KeyD']) {
    mario.vx *= FRICTION;
    if (Math.abs(mario.vx) < 0.1) mario.vx = 0;
  }

  mario.vy += GRAVITY;
  if (mario.vy > 15) mario.vy = 15;

  // Move X
  mario.x += mario.vx;
  if (mario.x < 0) { mario.x = 0; mario.vx = 0; }

  // Collide X
  const mRect = { x: mario.x + 2, y: mario.y + 2, w: mario.w - 4, h: mario.h - 4 };
  for (let bx = 0; bx < LEVEL_WIDTH; bx++) {
    if (!level[bx]) continue;
    for (let by = 0; by < 16; by++) {
      if (!level[bx][by]) continue;
      const tRect = { x: bx * TILE, y: by * TILE, w: TILE, h: TILE };
      if (level[bx][by] === 'pipe') {
        const pipe = pipes.find(p => p.x === bx * TILE && p.y <= by * TILE);
        if (pipe) { tRect.x = pipe.x; tRect.y = pipe.y; tRect.w = pipe.w; tRect.h = pipe.h; if (by !== 14 - Math.floor(pipe.h / TILE)) continue; }
      }
      if (rectCollide(mRect, tRect)) {
        if (mario.vx > 0) mario.x = tRect.x - mario.w + 2;
        else if (mario.vx < 0) mario.x = tRect.x + tRect.w - 2;
        mario.vx = 0;
      }
    }
  }

  // Move Y
  mario.y += mario.vy;
  mario.onGround = false;
  const mRect2 = { x: mario.x + 2, y: mario.y + 2, w: mario.w - 4, h: mario.h - 4 };
  for (let bx = 0; bx < LEVEL_WIDTH; bx++) {
    if (!level[bx]) continue;
    for (let by = 0; by < 16; by++) {
      if (!level[bx][by]) continue;
      const tRect = { x: bx * TILE, y: by * TILE, w: TILE, h: TILE };
      if (level[bx][by] === 'pipe') {
        const pipe = pipes.find(p => p.x === bx * TILE && p.y <= by * TILE);
        if (pipe) { tRect.x = pipe.x; tRect.y = pipe.y; tRect.w = pipe.w; tRect.h = pipe.h; if (by !== 14 - Math.floor(pipe.h / TILE)) continue; }
      }
      if (rectCollide(mRect2, tRect)) {
        if (mario.vy > 0) { mario.y = tRect.y - mario.h + 2; mario.vy = 0; mario.onGround = true; }
        else if (mario.vy < 0) {
          mario.y = tRect.y + tRect.h - 2;
          mario.vy = 1;
          hitBlock(bx, by);
        }
      }
    }
  }

  // Fall
  if (mario.y > H + 50) killMario();

  // Flagpole
  if (!mario.win && mario.x + mario.w > flagpole.x) {
    mario.win = true;
    mario.vx = 0;
    score += 5000;
    setTimeout(() => {
      gameState = 'win';
    }, 2000);
  }

  // Enemies
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.vx;
    e.vy += GRAVITY;
    e.y += e.vy;

    // Enemy ground collision
    const eRect = { x: e.x + 4, y: e.y + 4, w: e.w - 8, h: e.h - 4 };
    for (let bx = 0; bx < LEVEL_WIDTH; bx++) {
      if (!level[bx]) continue;
      for (let by = 0; by < 16; by++) {
        if (!level[bx][by]) continue;
        const tRect = { x: bx * TILE, y: by * TILE, w: TILE, h: TILE };
        if (rectCollide(eRect, tRect)) {
          if (e.vy > 0) { e.y = tRect.y - e.h; e.vy = 0; }
          if (e.vx > 0 && e.y + e.h > tRect.y + 4) e.vx = -e.vx;
          else if (e.vx < 0 && e.y + e.h > tRect.y + 4) e.vx = -e.vx;
        }
      }
    }

    if (e.y > H + 100) e.alive = false;

    // Mario collision
    if (!mario.dead && !mario.win && mario.invincible <= 0) {
      const mR = { x: mario.x, y: mario.y, w: mario.w, h: mario.h };
      const eR = { x: e.x, y: e.y, w: e.w, h: e.h };
      if (rectCollide(mR, eR)) {
        if (mario.vy > 0 && mario.y + mario.h - 8 < e.y + e.h / 2) {
          e.alive = false;
          mario.vy = JUMP_FORCE * 0.7;
          score += 100;
          addFloatingText(e.x, e.y - 10, '+100');
          addParticle(e.x + 16, e.y + 16, '#C84C09');
        } else {
          killMario();
        }
      }
    }
  });

  // Coins
  coinItems.forEach(c => {
    if (c.collected) return;
    const mR = { x: mario.x, y: mario.y, w: mario.w, h: mario.h };
    const cR = { x: c.x, y: c.y, w: c.w, h: c.h };
    if (rectCollide(mR, cR)) {
      c.collected = true;
      coins++;
      score += 200;
      addFloatingText(c.x, c.y - 10, '+200', '#FFD700');
      addParticle(c.x + 8, c.y + 8, '#FFD700', 8);
      if (coins >= 100) { coins -= 100; lives++; }
    }
  });

  // Camera
  const targetX = mario.x - W / 3;
  cameraX = Math.max(cameraX, targetX);
  cameraX = Math.max(0, Math.min(cameraX, LEVEL_WIDTH * TILE - W));

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; });
  particles = particles.filter(p => p.life > 0);

  // Floating texts
  floatingTexts.forEach(ft => { ft.y += ft.vy; ft.life--; });
  floatingTexts = floatingTexts.filter(ft => ft.life > 0);

  // Anim
  mario.animTimer++;
  if (Math.abs(mario.vx) > 0.5) mario.frame = Math.floor(mario.animTimer / 6) % 3;
  else mario.frame = 0;

  if (mario.invincible > 0) mario.invincible--;
}

function hitBlock(bx, by) {
  const b = blocks.find(bl => bl.x === bx * TILE && bl.y === by * TILE);
  if (!b || b.hit) return;
  if (b.type === 'question') {
    b.hit = true;
    coins++;
    score += 200;
    addFloatingText(b.x, b.y - 20, '+200', '#FFD700');
    addParticle(b.x + 16, b.y, '#FFD700', 8);
    if (coins >= 100) { coins -= 100; lives++; }
  } else if (b.type === 'brick') {
    b.hit = true;
    level[bx][by] = null;
    score += 50;
    addParticle(b.x + 16, b.y + 16, '#C84C09', 10);
    addFloatingText(b.x, b.y - 10, '+50');
  }
}

function killMario() {
  if (mario.dead) return;
  mario.dead = true;
  mario.vy = JUMP_FORCE;
  mario.vx = 0;
  lives--;
  setTimeout(() => {
    if (lives > 0) { resetMario(); gameState = 'playing'; }
    else gameState = 'gameover';
  }, 2000);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  if (gameState === 'title') {
    drawBackground();
    ctx.fillStyle = '#E52521';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('SUPER MARIO', W / 2, 160);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('BROWSER EDITION', W / 2, 200);
    ctx.fillStyle = '#fff';
    ctx.font = '18px Arial';
    const blink = Math.floor(Date.now() / 500) % 2;
    if (blink) ctx.fillText('PRESS ENTER TO START', W / 2, 300);
    ctx.font = '14px Arial';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Arrow Keys: Move  |  Space: Jump', W / 2, 360);
    return;
  }

  drawBackground();

  // Draw blocks
  blocks.forEach(b => { if (b.x - cameraX > -TILE * 2 && b.x - cameraX < W + TILE * 2) drawBlock(b); });

  // Draw pipes
  pipes.forEach(p => {
    if (p.x - cameraX > -p.w && p.x - cameraX < W + p.w) {
      ctx.fillStyle = '#00A800';
      ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
      ctx.fillStyle = '#00D800';
      ctx.fillRect(p.x - cameraX + 3, p.y, 10, p.h);
      ctx.fillStyle = '#006800';
      ctx.fillRect(p.x - cameraX + p.w - 6, p.y, 6, p.h);
      ctx.fillStyle = '#00C800';
      ctx.fillRect(p.x - cameraX - 4, p.y, p.w + 8, 8);
      ctx.fillRect(p.x - cameraX - 2, p.y + 8, p.w + 4, 4);
    }
  });

  drawFlagpole();

  // Draw coins
  coinItems.forEach(c => { if (!c.collected) drawCoinItem(c); });

  // Draw enemies
  enemies.forEach(e => {
    if (!e.alive) return;
    if (e.x - cameraX > -TILE * 2 && e.x - cameraX < W + TILE * 2) {
      if (e.type === 'goomba') drawGoomba(e);
      else drawKoopa(e);
    }
  });

  // Draw Mario
  if (gameState !== 'gameover') drawMario();

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 50;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Floating texts
  floatingTexts.forEach(ft => {
    ctx.globalAlpha = ft.life / 60;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x - cameraX, ft.y);
  });
  ctx.globalAlpha = 1;

  // UI
  document.getElementById('scoreDisplay').textContent = 'SCORE: ' + score;
  document.getElementById('coinDisplay').textContent = 'COINS: ' + coins;
  document.getElementById('livesDisplay').textContent = 'LIVES: ' + lives;
  document.getElementById('timeDisplay').textContent = 'TIME: ' + time;

  if (gameState === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#E52521';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '18px Arial';
    ctx.fillText('Score: ' + score, W / 2, H / 2 + 20);
    ctx.fillText('Press R to Restart', W / 2, H / 2 + 60);
  }

  if (gameState === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL CLEAR!', W / 2, H / 2 - 40);
    ctx.fillStyle = '#fff';
    ctx.font = '24px Arial';
    ctx.fillText('Score: ' + score, W / 2, H / 2 + 10);
    ctx.fillText('Coins: ' + coins, W / 2, H / 2 + 40);
    ctx.font = '16px Arial';
    ctx.fillText('Press R to Play Again', W / 2, H / 2 + 80);
  }

  if (gameState === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = '16px Arial';
    ctx.fillText('Press P to Resume', W / 2, H / 2 + 40);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('keydown', e => {
  if (e.code === 'Enter') {
    if (gameState === 'title') { initLevel(); resetMario(); gameState = 'playing'; }
  }
  if (e.code === 'KeyR') {
    if (gameState === 'gameover' || gameState === 'win') { initLevel(); resetMario(); gameState = 'playing'; }
  }
  if (e.code === 'KeyP') {
    if (gameState === 'playing') gameState = 'paused';
    else if (gameState === 'paused') gameState = 'playing';
  }
});

initLevel();
resetMario();
gameLoop();
</script>
</body>
