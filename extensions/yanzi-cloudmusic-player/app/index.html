<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网易云音乐 - 燕子小程序</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航栏 -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" class="icon-brand"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <span class="brand-name">网易云音乐</span>
        </div>

        <!-- 主歌单 TAB 切换 -->
        <div class="main-tabs">
          <button class="main-tab-btn active" id="tabNavRecommend">
            <svg viewBox="0 0 24 24" class="tab-icon"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/></svg>
            每日推荐 (<span id="recommendCount">30</span>)
          </button>
          <button class="main-tab-btn" id="tabNavFavorites">
            <svg viewBox="0 0 24 24" class="tab-icon tab-icon-heart"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            我喜欢的 (<span id="favoriteCount">400</span>)
          </button>
        </div>
      </div>

      <div class="header-right">
        <!-- 过滤选择: 全部 / 仅完整 -->
        <div class="filter-pills">
          <button class="pill-btn active" id="tabAll">全部 (<span id="totalCount">0</span>)</button>
          <button class="pill-btn" id="tabFullOnly">仅完整版 (<span id="fullCount">0</span>)</button>
        </div>

        <!-- 搜索框 -->
        <div class="search-box">
          <svg viewBox="0 0 24 24" class="icon-search"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="searchInput" placeholder="搜索歌名/歌手/专辑...">
        </div>

        <!-- 客户端缓存收录监听开关与立即收录按钮 -->
        <div class="sync-control-group">
          <button class="btn-manual-sync" id="btnManualSync" title="立即扫描收录网易云客户端刚刚播放的歌曲">
            <svg viewBox="0 0 24 24" class="icon-sync-spin"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            <span>一键收录</span>
          </button>
          <label class="sync-switch" id="syncSwitchWrap" title="开启后，在网易云客户端播放的歌曲将自动解密收录到小程序；收录完成后可关闭以节省资源">
            <input type="checkbox" id="syncSwitch">
            <span class="sync-slider"></span>
            <span class="sync-label" id="syncLabelText">收录监听: 关</span>
          </label>
        </div>

        <!-- 本机专属标识 -->
        <div class="badge-local" title="仅限本机离线播放，不跨机同步">
          <span class="dot"></span> 本机专属
        </div>
      </div>
    </header>

    <!-- 顶部轻量浮动消息 Toast -->
    <div class="toast-tip" id="toastTip"></div>

    <!-- 中间主体：宽幅高密度歌曲列表 -->
    <main class="list-wrapper">
      <!-- 歌单概览与高能操作工具栏 (Action Bar) -->
      <section class="playlist-action-bar">
        <div class="action-bar-left">
          <div class="playlist-hero-badge" id="playlistHeroBadge">
            <svg viewBox="0 0 24 24" class="hero-badge-svg" id="heroBadgeSvg"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/></svg>
            <span class="hero-badge-day" id="heroBadgeDay">15</span>
          </div>
          <div class="playlist-hero-info">
            <div class="hero-title-row">
              <h1 class="playlist-hero-title" id="playlistHeroTitle">每日推荐</h1>
              <span class="hero-privacy-tag">本机专属私有库</span>
            </div>
            <div class="playlist-hero-meta">
              <span class="meta-item" id="playlistMetaSummary">精心聚合推荐 · 30 首歌曲</span>
              <span class="meta-dot">·</span>
              <span class="meta-item meta-highlight" id="playlistMetaReady">76 首完整无损母带就绪</span>
            </div>
          </div>
        </div>

        <div class="action-bar-right">
          <!-- 核心操作 1: 播放全部主按钮 -->
          <button class="btn-action-primary" id="btnPlayAll" title="从第一首开始顺序播放当前列表 (快捷键 Shift+Enter)">
            <svg viewBox="0 0 24 24" class="icon-action-btn"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            <span>播放全部</span>
          </button>

          <!-- 核心操作 2: 随机播放按钮 -->
          <button class="btn-action-secondary" id="btnShufflePlay" title="开启随机播放并随机挑一首即刻开播">
            <svg viewBox="0 0 24 24" class="icon-action-btn"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            <span>随机播放</span>
          </button>

          <!-- 核心操作 3: 播放模式切换胶囊 -->
          <div class="mode-capsule-wrap">
            <button class="btn-mode-capsule" id="btnModeCapsule" title="点击轮换播放模式 (快捷键 P)">
              <span class="capsule-icon" id="capsuleIcon">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
              </span>
              <span class="capsule-text" id="capsuleText">列表循环</span>
            </button>
          </div>
        </div>
      </section>

      <div class="table-scroll-container">
        <table class="song-table">
          <thead>
            <tr>
              <th class="th-num">#</th>
              <th class="th-title">音乐标题</th>
              <th class="th-artist">歌手</th>
              <th class="th-album">专辑</th>
              <th class="th-duration">时长</th>
            </tr>
          </thead>
          <tbody id="songListBody">
            <!-- 由 JS 填充 -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- 底部常驻播放控制栏 (70px) -->
    <footer class="player-bar">
      <!-- 左侧：唱片小封面 + 曲目信息 -->
      <div class="bar-left">
        <div class="bar-cover-wrap" id="barCoverWrap" title="点击展开/折叠黑胶大唱片视图">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23252530'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23323242'/%3E%3Cpath d='M42 35v30l24-15z' fill='%23ec4141'/%3E%3C/svg%3E" alt="Cover" class="bar-cover" id="coverImg">
          <div class="cover-overlay">
            <svg viewBox="0 0 24 24" class="icon-expand"><path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" transform="rotate(-90 12 12)"/></svg>
          </div>
        </div>
        <div class="bar-info">
          <div class="bar-title-row">
            <span class="bar-title" id="songTitle">请选择播放曲目</span>
            <span class="bar-badge" id="songBadge"></span>
          </div>
          <div class="bar-artist" id="songArtist">-</div>
        </div>
      </div>

      <!-- 中间：核心控制 + 进度条 -->
      <div class="bar-center">
        <div class="bar-controls">
          <button class="btn-tool" id="btnMode" title="播放模式: 列表循环 (快捷键 P)">
            <svg viewBox="0 0 24 24" class="icon-ctrl" id="modeIcon"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          </button>
          <button class="btn-tool" id="btnPrev" title="上一首 (Ctrl+Alt+Left / ←)">
            <svg viewBox="0 0 24 24" class="icon-ctrl"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="btn-play-main" id="btnPlay" title="播放/暂停 (Space / Ctrl+Alt+Space)">
            <svg viewBox="0 0 24 24" class="icon-play-main" id="playIcon"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="btn-tool" id="btnNext" title="下一首 (Ctrl+Alt+Right / →)">
            <svg viewBox="0 0 24 24" class="icon-ctrl"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <div class="bar-progress-row">
          <span class="time-text" id="currentTime">00:00</span>
          <div class="progress-track" id="progressContainer">
            <div class="progress-bar-bg"></div>
            <div class="progress-bar-fill" id="progressBar"></div>
            <div class="progress-dot" id="progressThumb"></div>
          </div>
          <span class="time-text" id="totalTime">00:00</span>
        </div>
      </div>

      <!-- 右侧：音量、跳过试听、播放队列抽屉按钮 -->
      <div class="bar-right">
        <label class="skip-toggle" title="自动跳过VIP试听歌曲，只播完整曲目">
          <input type="checkbox" id="skipTrialCheckbox">
          <span>跳过试听</span>
        </label>

        <div class="volume-box">
          <button class="btn-tool-sub" id="btnVolume" title="静音/恢复 (快捷键 M)">
            <svg viewBox="0 0 24 24" class="icon-vol" id="volumeIcon"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>

        <button class="btn-cache-pill" id="btnCacheAll" title="一键将当前歌单全部预缓存至本地">
          <svg viewBox="0 0 24 24" class="icon-cache-btn"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
          <span>已缓存 <strong id="cachedCount">0</strong></span>
        </button>

        <!-- 当前播放队列抽屉呼出按钮 -->
        <button class="btn-tool-sub btn-queue-trigger" id="btnQueueToggle" title="查看正在播放队列 (快捷键 L)">
          <svg viewBox="0 0 24 24" class="icon-queue-svg"><path fill="currentColor" d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
          <span class="queue-badge" id="queueBadge">0</span>
        </button>
      </div>
    </footer>

    <!-- 侧边滑出：当前播放队列抽屉 (Queue Drawer) -->
    <aside class="queue-drawer" id="queueDrawer">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <h3 class="drawer-heading">播放队列</h3>
          <span class="drawer-count-badge" id="drawerCountBadge">共 30 首</span>
        </div>
        <div class="drawer-actions">
          <button class="btn-drawer-btn" id="btnLocatePlaying" title="滚动定位到当前播放歌曲">
            <svg viewBox="0 0 24 24" style="width:13px;height:13px"><path fill="currentColor" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            <span>定位</span>
          </button>
          <button class="btn-drawer-close" id="btnQueueClose" title="收起播放队列 (Esc)">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
      </div>
      <div class="drawer-list" id="drawerList">
        <!-- JS 动态渲染 -->
      </div>
    </aside>

    <!-- 侧边抽屉半透明遮罩 -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <!-- 沉浸式黑胶唱片 & K歌大视图（点击左下角封面弹出） -->
    <div class="vinyl-modal" id="vinylModal">
      <div class="modal-backdrop" id="modalBackdrop"></div>

      <div class="modal-card">
        <button class="btn-modal-close" id="btnModalClose" title="收起黑胶与歌词视图 (Esc)">
          <svg viewBox="0 0 24 24" class="icon-close"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>

        <div class="modal-split-layout">
          <!-- 左栏：黑胶大唱片 + 唱针 + 快捷大控制条 -->
          <div class="modal-col-left">
            <div class="disc-large-wrapper">
              <!-- 黑胶唱针拟真动画 -->
              <div class="vinyl-tonearm" id="vinylTonearm">
                <div class="tonearm-base"></div>
                <div class="tonearm-rod"></div>
                <div class="tonearm-head"></div>
              </div>
              <div class="disc-large" id="vinylDisc">
                <div class="disc-grooves"></div>
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23252530'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23323242'/%3E%3Cpath d='M42 35v30l24-15z' fill='%23ec4141'/%3E%3C/svg%3E" alt="Cover" class="disc-large-cover" id="modalCoverImg">
                <div class="disc-center"></div>
              </div>
            </div>

            <!-- 控制条与音质徽章 -->
            <div class="modal-disc-meta">
              <div class="modal-badge-container" id="modalBadgeContainer"></div>
              <div class="modal-quick-ctrls">
                <button class="modal-btn-ctrl" id="modalBtnPrev" title="上一首">
                  <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="modal-btn-play" id="modalBtnPlay" title="播放/暂停">
                  <svg viewBox="0 0 24 24" id="modalPlayIcon"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="modal-btn-ctrl" id="modalBtnNext" title="下一首">
                  <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- 右栏：K歌沉浸歌词区 -->
          <div class="modal-col-right">
            <!-- 头部歌曲名、歌手与专辑 -->
            <div class="lyrics-header">
              <h2 class="modal-song-title" id="modalSongTitle">请选择播放曲目</h2>
              <div class="lyrics-subinfo">
                <span class="modal-song-artist" id="modalSongArtist">-</span>
                <span class="lyrics-dot">·</span>
                <span class="modal-song-album" id="modalSongAlbum">-</span>
              </div>
            </div>

            <!-- 歌词主滚动视口 -->
            <div class="lyrics-viewport" id="lyricsViewport">
              <div class="lyrics-scroll-wrap" id="lyricsScrollWrap">
                <div class="lyrics-empty-state" id="lyricsEmptyState">
                  <div class="lyrics-loading-dots">
                    <span></span><span></span><span></span>
                  </div>
                  <p class="lyrics-empty-text" id="lyricsEmptyText">正在加载歌词...</p>
                </div>
              </div>
            </div>

            <!-- 底部辅助控制与提示栏 -->
            <div class="lyrics-footer">
              <span class="lyrics-tip">💡 点击任意一行歌词即可即时跳转跟唱</span>
              <div class="lyrics-tools">
                <button class="btn-lyrics-tool" id="btnToggleTrans" title="显示/隐藏双语翻译">译</button>
                <button class="btn-lyrics-tool" id="btnLyricsFontDown" title="减小歌词字号">A-</button>
                <button class="btn-lyrics-tool" id="btnLyricsFontUp" title="增大歌词字号">A+</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 隐藏音频播放元素 -->
    <audio id="audioPlayer" preload="auto"></audio>
  </div>

  <script src="data.js"></script>
  <script src="music-session.js"></script>
  <script src="app.js"></script>
</body>
</html>
