<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#2E6BA4"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="450" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="520" cy="70" r="45" fill="url(#sun)">
    <animate attributeName="r" values="45;48;45" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="70" r="52" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="52;60;52" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Clouds -->
  <g opacity="0.8">
    <ellipse cx="100" cy="60" rx="40" ry="20" fill="white"/>
    <ellipse cx="130" cy="50" rx="35" ry="22" fill="white"/>
    <ellipse cx="155" cy="60" rx="30" ry="18" fill="white"/>

    <ellipse cx="350" cy="45" rx="35" ry="18" fill="white"/>
    <ellipse cx="380" cy="38" rx="30" ry="20" fill="white"/>
    <ellipse cx="400" cy="48" rx="25" ry="16" fill="white"/>
  </g>

  <!-- Ground / Path -->
  <ellipse cx="300" cy="380" rx="280" ry="30" fill="#8B7355"/>
  <ellipse cx="300" cy="378" rx="270" ry="25" fill="#A0926B"/>
  <ellipse cx="300" cy="376" rx="260" ry="20" fill="#BDB28B"/>

  <!-- Water -->
  <rect x="0" y="410" width="600" height="40" fill="url(#water)" opacity="0.6"/>

  <!-- ===== BICYCLE ===== -->
  <g transform="translate(240, 280)">
    <!-- Back wheel -->
    <circle cx="0" cy="80" r="40" fill="none" stroke="#333" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 0 80;360 0 80" dur="1s" repeatCount="indefinite"/>
    </circle>
    <!-- Back wheel spokes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 80;360 0 80" dur="1s" repeatCount="indefinite"/>
      <line x1="0" y1="50" x2="0" y2="110" stroke="#555" stroke-width="1.5"/>
      <line x1="-25" y1="65" x2="25" y2="95" stroke="#555" stroke-width="1.5"/>
      <line x1="-25" y1="95" x2="25" y2="65" stroke="#555" stroke-width="1.5"/>
      <line x1="-12" y1="52" x2="12" y2="108" stroke="#555" stroke-width="1.5"/>
      <line x1="-12" y1="108" x2="12" y2="52" stroke="#555" stroke-width="1.5"/>
    </g>
    <circle cx="0" cy="80" r="6" fill="#666"/>

    <!-- Front wheel -->
    <circle cx="140" cy="80" r="40" fill="none" stroke="#333" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 140 80;360 140 80" dur="1s" repeatCount="indefinite"/>
    </circle>
    <!-- Front wheel spokes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 140 80;360 140 80" dur="1s" repeatCount="indefinite"/>
      <line x1="140" y1="50" x2="140" y2="110" stroke="#555" stroke-width="1.5"/>
      <line x1="115" y1="65" x2="165" y2="95" stroke="#555" stroke-width="1.5"/>
      <line x1="115" y1="95" x2="165" y2="65" stroke="#555" stroke-width="1.5"/>
      <line x1="128" y1="52" x2="152" y2="108" stroke="#555" stroke-width="1.5"/>
      <line x1="128" y1="108" x2="152" y2="52" stroke="#555" stroke-width="1.5"/>
    </g>
    <circle cx="140" cy="80" r="6" fill="#666"/>

    <!-- Frame -->
    <line x1="0" y1="80" x2="60" y2="20" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="140" y2="80" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="90" y2="20" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="20" x2="140" y2="80" stroke="#E63946" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="30" y2="20" stroke="#E63946" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="20" x2="0" y2="80" stroke="#E63946" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="20" x2="40" y2="40" stroke="#E63946" stroke-width="4" stroke-linecap="round"/>

    <!-- Seat -->
    <ellipse cx="30" cy="15" rx="15" ry="5" fill="#333"/>
    <line x1="30" y1="15" x2="30" y2="20" stroke="#333" stroke-width="3"/>

    <!-- Handlebars -->
    <line x1="90" y1="20" x2="100" y2="5" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="88" y1="5" x2="112" y2="5" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <circle cx="88" cy="5" r="4" fill="#555"/>
    <circle cx="112" cy="5" r="4" fill="#555"/>

    <!-- Pedals -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="1s" repeatCount="indefinite"/>
      <circle cx="50" cy="50" r="5" fill="#555"/>
      <line x1="50" y1="45" x2="50" y2="35" stroke="#444" stroke-width="3"/>
      <rect x="42" y="32" width="16" height="5" rx="2" fill="#333"/>
      <line x1="50" y1="55" x2="50" y2="65" stroke="#444" stroke-width="3"/>
      <rect x="42" y="63" width="16" height="5" rx="2" fill="#333"/>
    </g>

    <!-- Chain ring -->
    <circle cx="50" cy="50" r="12" fill="none" stroke="#666" stroke-width="2"/>
  </g>

  <!-- ===== PELICAN ===== -->
  <g transform="translate(260, 180)">
    <!-- Pelican body -->
    <ellipse cx="0" cy="85" rx="45" ry="30" fill="#F5F5F0"/>
    <ellipse cx="0" cy="85" rx="42" ry="27" fill="#FAFAF5"/>

    <!-- Wing -->
    <path d="M -10 75 Q -40 60 -35 90 Q -30 105 0 100" fill="#E8E8E0" stroke="#DDD" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 0 85;-8 0 85;0 0 85" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M -5 78 Q -30 68 -28 88 Q -25 98 0 95" fill="#DDD" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 0 85;-8 0 85;0 0 85" dur="0.5s" repeatCount="indefinite"/>
    </path>

    <!-- Wing feather details -->
    <path d="M -8 80 Q -25 72 -22 88" fill="none" stroke="#CCC" stroke-width="1" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0 0 85;-8 0 85;0 0 85" dur="0.5s" repeatCount="indefinite"/>
    </path>

    <!-- Tail -->
    <path d="M -40 80 Q -55 70 -50 90 Q -45 100 -35 95" fill="#E0E0D8"/>
    <path d="M -38 82 Q -52 75 -48 88 Q -44 95 -36 92" fill="#D5D5CD"/>

    <!-- Neck -->
    <path d="M 20 75 Q 30 50 35 25" fill="none" stroke="#F5F5F0" stroke-width="18" stroke-linecap="round"/>
    <path d="M 20 75 Q 30 50 35 25" fill="none" stroke="#FAFAF5" stroke-width="14" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="38" cy="18" rx="16" ry="14" fill="#FAFAF5"/>

    <!-- Eye -->
    <circle cx="44" cy="12" r="5" fill="white"/>
    <circle cx="45" cy="11" r="3" fill="#222"/>
    <circle cx="46" cy="10" r="1" fill="white"/>

    <!-- Beak - upper -->
    <path d="M 50 14 Q 70 10 85 16 Q 70 20 50 18 Z" fill="#FF8C42"/>
    <path d="M 50 15 Q 68 12 82 16" fill="none" stroke="#E07030" stroke-width="1"/>

    <!-- Beak - lower with pouch -->
    <path d="M 50 18 Q 65 22 80 18 Q 75 35 55 30 Q 50 25 50 18 Z" fill="#FF6B35" opacity="0.9"/>
    <path d="M 52 20 Q 62 28 72 20" fill="none" stroke="#E05525" stroke-width="0.8" opacity="0.6"/>

    <!-- Beak tip -->
    <circle cx="83" cy="16" r="2" fill="#E07030"/>

    <!-- Crown tuft -->
    <path d="M 30 5 Q 35 -8 40 2" fill="none" stroke="#DDD" stroke-width="2" stroke-linecap="round"/>
    <path d="M 33 6 Q 38 -5 42 4" fill="none" stroke="#E8E8E0" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Legs -->
    <!-- Left leg -->
    <line x1="-10" y1="110" x2="-15" y2="135" stroke="#FF8C42" stroke-width="4" stroke-linecap="round"/>
    <line x1="-15" y1="135" x2="-25" y2="140" stroke="#FF8C42" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="135" x2="-8" y2="142" stroke="#FF8C42" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="135" x2="-18" y2="143" stroke="#FF8C42" stroke-width="3" stroke-linecap="round"/>

    <!-- Right leg (on pedal) -->
    <line x1="5" y1="110" x2="0" y2="135" stroke="#FF8C42" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="135" x2="-10" y2="140" stroke="#FF8C42" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="135" x2="7" y2="142" stroke="#FF8C42" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="135" x2="-3" y2="143" stroke="#FF8C42" stroke-width="3" stroke-linecap="round"/>

    <!-- Webbed feet details -->
    <path d="M -25 140 L -18 138 L -8 142" fill="none" stroke="#E07030" stroke-width="1.5"/>
    <path d="M -10 140 L -3 138 L 7 142" fill="none" stroke="#E07030" stroke-width="1.5"/>
  </g>

  <!-- Speed lines -->
  <g opacity="0.4">
    <line x1="140" y1="290" x2="100" y2="290" stroke="#999" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="140;120;140" dur="0.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100;80;100" dur="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="305" x2="110" y2="305" stroke="#999" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" values="150;130;150" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="110;90;110" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="145" y1="320" x2="105" y2="320" stroke="#999" stroke-width="1" stroke-linecap="round">
      <animate attributeName="x1" values="145;125;145" dur="0.35s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="105;85;105" dur="0.35s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Ground texture dots -->
  <g fill="#A09070" opacity="0.3">
    <circle cx="100" cy="375" r="2"/>
    <circle cx="200" cy="378" r="1.5"/>
    <circle cx="320" cy="373" r="2"/>
    <circle cx="420" cy="377" r="1.5"/>
    <circle cx="500" cy="375" r="2"/>
    <circle cx="150" cy="382" r="1"/>
    <circle cx="380" cy="380" r="1"/>
    <circle cx="460" cy="379" r="1.5"/>
  </g>

  <!-- Small birds in sky -->
  <g fill="none" stroke="#666" stroke-width="1.5" opacity="0.4">
    <path d="M 80 100 Q 85 95 90 100 Q 95 95 100 100"/>
    <path d="M 450 80 Q 454 76 458 80 Q 462 76 466 80"/>
  </g>

  <!-- Title text -->
  <text x="300" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5A7A9A" font-weight="bold" opacity="0.7">
    Pelican riding a bicycle
  </text>
</svg>
