name = "yanzi-sync"
main = "src/index.js"
compatibility_date = "2026-04-23"

# VIP entitlement must be enforced on every costly cloud endpoint.
[vars]
CLOUD_VIP_ONLY = "true"

# Persist sampled structured request logs without D1 writes.
[observability]
enabled = true
head_sampling_rate = 1

# Bound requests per login identity + client network, before any D1 auth lookup.
[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "9101101"
  [ratelimits.simple]
  limit = 8
  period = 60
[[ratelimits]]
name = "EXPORT_RATE_LIMITER"
namespace_id = "9101102"
  [ratelimits.simple]
  limit = 30
  period = 60
[[durable_objects.bindings]]
name = "DEVICE_RELAY"
class_name = "DeviceRelay"

# device-relay-v1 was applied by the Git build on 2026-10-01.
# Per repository deployment policy, do not recreate the existing namespace.

[triggers]
crons = ["*/30 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "openquickhost-sync-db"
database_id = "512f99ac-4f5f-4e30-affb-58fc4da94bfa"

[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "openquickhost-sync-assets"

[[routes]]
pattern = "sync.luoluoluo.cc.cd"
custom_domain = true


